<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Desk – Inventory</title>
<style>
  :root{
    --navy:#0f2a56;
    --navy-2:#16356a;
    --teal:#1f8a8a;
    --teal-dark:#177576;
    --teal-soft:#e3f2ef;
    --coral:#f0806a;
    --coral-soft:#fde4de;
    --bg:#fdf8f5;
    --text:#14213d;
    --muted:#5b6478;
    --line:#e6e9ee;
    --green-bg:#c9f0cf;
    --green-text:#1d7a33;
    --red-bg:#fcd5d5;
    --red-text:#c42b2b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
  }

  /* Sidebar */
  .sidebar{
    width:290px;
    background:var(--navy);
    color:#fff;
    padding:22px 12px;
    flex-shrink:0;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:14px;padding:0 20px 28px}
  .brand svg{width:44px;height:44px}
  .brand span{font-size:30px;font-weight:700;letter-spacing:.2px}
  .nav a{
    display:flex;align-items:center;gap:20px;
    padding:14px 22px;margin-bottom:6px;
    color:#e8eefb;text-decoration:none;
    font-size:21px;font-weight:500;border-radius:12px;
    transition:background .15s;
  }
  .nav a svg{width:30px;height:30px;flex-shrink:0}
  .nav a:hover{background:rgba(255,255,255,.08)}
  .nav a.active{background:var(--teal);color:#fff}

  /* Main */
  main{flex:1;padding:14px 16px 40px 28px;min-width:0}
  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  header.top h1{font-size:50px;line-height:1.1;font-weight:700}
  header.top p{font-size:23px;color:var(--muted);margin-top:4px}
  .btn-add{
    display:flex;align-items:center;gap:12px;
    background:var(--teal);color:#fff;border:0;cursor:pointer;
    font-size:23px;font-weight:500;padding:15px 30px;border-radius:14px;
    box-shadow:0 4px 10px rgba(31,138,138,.25);
    transition:background .15s, transform .1s;
    white-space:nowrap;
  }
  .btn-add:hover{background:var(--teal-dark)}
  .btn-add:active{transform:scale(.98)}
  .btn-add svg{width:26px;height:26px}

  /* Stat cards */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0 26px}
  .card{
    display:flex;align-items:center;gap:22px;
    padding:22px 28px;border-radius:18px;
    background:var(--teal-soft);
  }
  .card.warn{background:var(--coral-soft)}
  .card .icon{
    width:84px;height:84px;border-radius:16px;
    background:#3f9d94;display:grid;place-items:center;flex-shrink:0;
  }
  .card.warn .icon{background:var(--coral)}
  .card .icon svg{width:46px;height:46px;stroke:#fff}
  .card .label{font-size:23px;font-weight:600;color:#26324d}
  .card .value{font-size:48px;font-weight:800;line-height:1.1;margin-top:2px}

  /* Toolbar */
  .toolbar{display:flex;gap:20px;margin-bottom:24px;flex-wrap:wrap}
  .search{
    position:relative;flex:1;min-width:240px;max-width:540px;
  }
  .search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:26px;height:26px;color:#4a5468}
  .search input, .select select{
    width:100%;height:50px;font-size:21px;font-family:inherit;color:var(--text);
    background:#fff;border:1.5px solid #b9c0cc;border-radius:12px;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search input{padding:0 16px 0 58px}
  .search input::placeholder{color:#6b7385}
  .select{position:relative;width:296px}
  .select select{appearance:none;-webkit-appearance:none;padding:0 48px 0 20px;cursor:pointer}
  .select svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;pointer-events:none}
  .search input:focus,.select select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,138,138,.18)}

  /* Table */
  .table-wrap{
    background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;
    overflow-x:auto;
  }
  table{width:100%;border-collapse:collapse;min-width:820px}
  thead th{
    background:#e1ebee;text-align:left;
    font-size:20px;font-weight:700;letter-spacing:.6px;
    padding:18px 16px;color:#1b2a44;
  }
  thead th:first-child{padding-left:28px}
  tbody td{
    padding:0 16px;height:88px;font-size:24px;
    border-top:1.5px solid var(--line);
  }
  tbody tr:first-child td{border-top:0}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#f6fafa}
  td.prod{display:flex;align-items:center;gap:24px;padding-left:28px;font-weight:600;height:88px}
  .thumb{
    width:106px;height:76px;border-radius:8px;
    display:grid;place-items:center;font-size:46px;flex-shrink:0;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
  }
  td.stock{font-weight:500;padding-left:34px}
  th.stock-h{padding-left:34px}
  .badge{
    display:inline-block;min-width:132px;text-align:center;
    padding:8px 18px;border-radius:12px;font-size:21px;font-weight:600;
  }
  .badge.ok{background:var(--green-bg);color:var(--green-text)}
  .badge.low{background:var(--red-bg);color:var(--red-text)}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:22px}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(15,42,86,.45);
    display:none;align-items:center;justify-content:center;padding:16px;z-index:10;
  }
  .overlay.open{display:flex}
  .modal{
    background:#fff;border-radius:18px;padding:28px;width:100%;max-width:460px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal h2{font-size:28px;margin-bottom:18px}
  .modal label{display:block;font-size:16px;font-weight:600;margin:12px 0 6px;color:#26324d}
  .modal input,.modal select{
    width:100%;height:44px;padding:0 12px;font-size:17px;font-family:inherit;
    border:1.5px solid #b9c0cc;border-radius:10px;outline:none;background:#fff;
  }
  .modal input:focus,.modal select:focus{border-color:var(--teal)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
  .actions button{
    height:44px;padding:0 22px;font-size:17px;font-weight:600;border-radius:10px;cursor:pointer;font-family:inherit;
  }
  .btn-cancel{background:#fff;border:1.5px solid #b9c0cc;color:var(--text)}
  .btn-save{background:var(--teal);border:0;color:#fff}
  .btn-save:hover{background:var(--teal-dark)}

  /* Responsive scale-down */
  @media (max-width:1280px){
    .sidebar{width:230px}
    .brand span{font-size:24px}
    .nav a{font-size:18px;gap:14px;padding:12px 16px}
    header.top h1{font-size:40px}
    header.top p{font-size:19px}
    .card .value{font-size:38px}
    .card .label{font-size:19px}
    .card .icon{width:64px;height:64px}
    .card .icon svg{width:34px;height:34px}
    tbody td{font-size:19px;height:76px}
    td.prod{height:76px;gap:16px}
    .thumb{width:80px;height:58px;font-size:34px}
    thead th{font-size:16px}
    .badge{font-size:17px;min-width:110px}
  }
  @media (max-width:860px){
    body{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;padding:12px}
    .brand{padding-bottom:12px}
    .nav{display:flex;overflow-x:auto;gap:4px}
    .nav a{margin:0;white-space:nowrap}
    .stats{grid-template-columns:1fr}
    main{padding:16px}
    .btn-add{font-size:17px;padding:12px 18px}
    header.top h1{font-size:32px}
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 18l6-11M31 18l-6-11"/>
      <path d="M5 18h38l-4 22a3 3 0 0 1-3 2.5H12a3 3 0 0 1-3-2.5L5 18z"/>
      <g fill="#fff" stroke="none">
        <circle cx="16" cy="27" r="1.6"/><circle cx="24" cy="27" r="1.6"/><circle cx="32" cy="27" r="1.6"/>
        <circle cx="16" cy="34" r="1.6"/><circle cx="24" cy="34" r="1.6"/><circle cx="32" cy="34" r="1.6"/>
      </g>
    </svg>
    <span>Shop Desk</span>
  </div>
  <nav class="nav">
    <a href="#"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15L16 4l12 11"/><path d="M7 13v14h18V13"/><path d="M13 27v-8h6v8"/></svg>Dashboard</a>
    <a href="#" class="active"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l11 6v14l-11 6-11-6V9z"/><path d="M5 9l11 6 11-6M16 15v14"/></svg>Inventory</a>
    <a href="#"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h4l3 14h14l3-10H9"/><circle cx="12" cy="26" r="2"/><circle cx="23" cy="26" r="2"/></svg>Orders</a>
    <a href="#"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="18" width="5" height="9"/><rect x="13" y="12" width="5" height="15"/><rect x="22" y="5" width="5" height="22"/><path d="M3 29h26"/></svg>Reports</a>
    <a href="#"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="4.5"/><path d="M16 3l2.2 3.2 3.8-.8 1 3.8 3.8 1-.8 3.8L29 16l-3.2 2.2.8 3.8-3.8 1-1 3.8-3.8-.8L16 29l-2.2-3.2-3.8.8-1-3.8-3.8-1 .8-3.8L3 16l3.200-2.2-.8-3.8 3.8-1 1-3.8 3.8.8z"/></svg>Settings</a>
  </nav>
</aside>

<main>
  <header class="top">
    <div>
      <h1>Inventory</h1>
      <p>Manage products and current stock.</p>
    </div>
    <button class="btn-add" id="openAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
      Add Product
    </button>
  </header>

  <section class="stats">
    <div class="card">
      <div class="icon"><svg viewBox="0 0 32 32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l11 6v14l-11 6-11-6V9z"/><path d="M5 9l11 6 11-6M16 15v14"/></svg></div>
      <div><div class="label">Total Products</div><div class="value" id="statTotal">124</div></div>
    </div>
    <div class="card warn">
      <div class="icon"><svg viewBox="0 0 32 32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4L3 27h26z"/><path d="M16 13v7"/><circle cx="16" cy="23.500" r=".6" fill="#fff"/></svg></div>
      <div><div class="label">Low Stock</div><div class="value" id="statLow">08</div></div>
    </div>
    <div class="card">
      <div class="icon"><svg viewBox="0 0 32 32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="19" cy="9" rx="8" ry="3.500"/><path d="M11 9v5c0 2 3.500 3.500 8 3.500s8-1.500 8-3.500V9"/><path d="M11 14v5c0 2 3.500 3.500 8 3.500s8-1.500 8-3.500v-5"/><ellipse cx="11" cy="21" rx="7" ry="3"/><path d="M4 21v4c0 1.700 3 3 7 3s7-1.300 7-3v-4"/></svg></div>
      <div><div class="label">Stock Value</div><div class="value" id="statValue">₱24,680</div></div>
    </div>
  </section>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="text" id="search" placeholder="Search products...">
    </div>
    <div class="select">
      <select id="category"><option value="">All Categories</option></select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:34%">PRODUCT</th>
          <th>SKU</th>
          <th>CATEGORY</th>
          <th>PRICE</th>
          <th class="stock-h">STOCK</th>
          <th>STATUS</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No products found.</div>
  </div>
</main>

<div class="overlay" id="overlay">
  <form class="modal" id="addForm">
    <h2>Add Product</h2>
    <label for="fName">Product name</label>
    <input id="fName" required>
    <div class="row">
      <div><label for="fSku">SKU</label><input id="fSku" required></div>
      <div><label for="fCat">Category</label>
        <select id="fCat">
          <option>Drinks</option><option>Dairy</option><option>Bakery</option>
          <option>Grocery</option><option>Canned Goods</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label for="fPrice">Price (₱)</label><input id="fPrice" type="number" min="0" step="0.01" required></div>
      <div><label for="fStock">Stock</label><input id="fStock" type="number" min="0" step="1" required></div>
    </div>
    <div class="actions">
      <button type="button" class="btn-cancel" id="cancel">Cancel</button>
      <button type="submit" class="btn-save">Save</button>
    </div>
  </form>
</div>

<script>
  const LOW_THRESHOLD = 5;
  const icons = {Drinks:["🥤","#f4e3e0"],Dairy:["🥛","#e3eef9"],Bakery:["🍞","#f6e8d3"],Grocery:["🍜","#dff1e2"],"Canned Goods":["🐟","#efe9dc"]};
  const products = [
    {name:"Cola Drink",sku:"DR-001",cat:"Drinks",price:25,stock:18,emoji:"🥤",bg:"#f1e4e1"},
    {name:"Fresh Milk",sku:"DA-014",cat:"Dairy",price:42,stock:5,emoji:"🥛",bg:"#e3eef9"},
    {name:"Loaf Bread",sku:"BK-006",cat:"Bakery",price:55,stock:12,emoji:"🍞",bg:"#f6e8d3"},
    {name:"Instant Noodles",sku:"GR-022",cat:"Grocery",price:15,stock:3,emoji:"🍜",bg:"#d9f0dc"},
    {name:"Brown Eggs",sku:"DA-009",cat:"Dairy",price:95,stock:24,emoji:"🥚",bg:"#efe8df"},
    {name:"Sardines",sku:"CN-018",cat:"Canned Goods",price:28,stock:7,emoji:"🐟",bg:"#ece6d8"}
  ];

  const $ = id => document.getElementById(id);
  const rows = $("rows"), search = $("search"), category = $("category");

  const cats = [...new Set(products.map(p => p.cat))];
  cats.forEach(c => category.insertAdjacentHTML("beforeend", `<option>${c}</option>`));

  const peso = n => "₱" + Number(n).toLocaleString("en-PH", {maximumFractionDigits:2});
  const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function render(){
    const q = search.value.trim().toLowerCase();
    const c = category.value;
    const list = products.filter(p =>
      (!c || p.cat === c) &&
      (!q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q))
    );
    rows.innerHTML = list.map(p => {
      const low = p.stock <= LOW_THRESHOLD;
      return `<tr>
        <td class="prod"><div class="thumb" style="background:${p.bg}">${p.emoji}</div>${esc(p.name)}</td>
        <td>${esc(p.sku)}</td>
        <td>${esc(p.cat)}</td>
        <td>${peso(p.price)}</td>
        <td class="stock">${p.stock}</td>
        <td><span class="badge ${low ? "low" : "ok"}">${low ? "Low Stock" : "In Stock"}</span></td>
      </tr>`;
    }).join("");
    $("empty").hidden = list.length > 0;
  }

  search.addEventListener("input", render);
  category.addEventListener("change", render);

  // Add-product modal
  const overlay = $("overlay");
  $("openAdd").onclick = () => { overlay.classList.add("open"); $("fName").focus(); };
  const close = () => { overlay.classList.remove("open"); $("addForm").reset(); };
  $("cancel").onclick = close;
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

  let total = 124, low = 8, value = 24680;
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const cat = $("fCat").value, [emoji,bg] = icons[cat] || ["📦","#eee"];
    const p = {name:$("fName").value.trim(), sku:$("fSku").value.trim(), cat,
               price:parseFloat($("fPrice").value), stock:parseInt($("fStock").value,10), emoji, bg};
    products.push(p);
    total++; value += p.price * p.stock; if (p.stock <= LOW_THRESHOLD) low++;
    $("statTotal").textContent = total;
    $("statLow").textContent = String(low).padStart(2,"0");
    $("statValue").textContent = peso(value);
    render(); close();
  });

  render();
</script>
</body>
</html>
