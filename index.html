<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Desk</title>
<style>
:root{
  --accent:#6366f1;
  --accent-2:color-mix(in srgb,var(--accent) 60%,#ec4899);
  --bg:#f4f5fb; --surface:#ffffff; --surface-2:#f0f1f9; --text:#161a33; --muted:#6b7191; --line:#e4e6f2;
  --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
  --shadow:0 1px 2px rgba(20,24,60,.05),0 8px 24px rgba(20,24,60,.06);
  --side:#12132b; --side-text:#b9bcdc;
  --r:16px;
}
:root[data-theme=dark]{
  --bg:#0c0d1f; --surface:#15172e; --surface-2:#1c1f3a; --text:#eceefe; --muted:#8f94b8; --line:#262a4b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --side:#090a18;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none;animation:float 18s ease-in-out infinite}
body::before{width:420px;height:420px;background:var(--accent);top:-120px;right:-80px}
body::after{width:360px;height:360px;background:#ec4899;bottom:-140px;left:30%;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,50px)}}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

/* sidebar */
.side{width:250px;background:var(--side);color:var(--side-text);padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;z-index:20;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 12px 26px;color:#fff;font-weight:800;font-size:20px;letter-spacing:.2px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 55%,transparent);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
.logo svg{width:22px;height:22px}
.nav{display:flex;flex-direction:column;gap:4px;position:relative}
.nav a{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;color:var(--side-text);text-decoration:none;font-weight:500;position:relative;transition:color .2s,background .2s,transform .2s;z-index:1}
.nav a svg{width:21px;height:21px;flex-shrink:0;transition:transform .3s}
.nav a:hover{color:#fff;background:rgba(255,255,255,.06);transform:translateX(3px)}
.nav a:hover svg{transform:scale(1.15) rotate(-6deg)}
.nav a.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.nav .count{margin-left:auto;font-size:12px;background:rgba(255,255,255,.14);padding:2px 8px;border-radius:99px;color:#fff}
.side-foot{margin-top:auto;padding:14px;border-radius:14px;background:rgba(255,255,255,.05);font-size:13px;line-height:1.4}
.side-foot b{color:#fff;display:block;margin-bottom:2px}

/* main */
main{flex:1;min-width:0;padding:26px 32px 60px;position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.burger{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:32px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--muted);margin-top:4px}
.view{animation:viewIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:0;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent);position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn.primary:hover::after{transform:translateX(120%)}
.btn.danger{color:var(--bad)}
.btn svg{width:18px;height:18px}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted);transition:all .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--accent);transform:scale(1.1)}
.icon-btn.del:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.icon-btn svg{width:17px;height:17px}

/* cards */
.grid{display:grid;gap:18px}
.stats{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;transition:transform .25s,box-shadow .25s}
.stat{display:flex;gap:16px;align-items:center;animation:pop .6s cubic-bezier(.2,1.2,.4,1) both;position:relative;overflow:hidden}
.stat:hover{transform:translateY(-5px)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.1;transition:transform .5s}
.stat:hover::after{transform:scale(1.5)}
.stat .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex-shrink:0}
.stat .ic svg{width:26px;height:26px}
.stat .l{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:28px;font-weight:800;margin-top:2px;letter-spacing:-.5px}
.two{grid-template-columns:1.4fr 1fr}
.card h3{font-size:17px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.card h3 a{font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}

/* bars */
.bar-row{display:grid;grid-template-columns:110px 1fr 90px;gap:12px;align-items:center;margin-bottom:14px;font-size:14px}
.bar-track{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar-row .n{text-align:right;font-weight:700}

/* list */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);animation:rowIn .45s both}
.li:last-child{border:0}
.emoji{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--surface-2);flex-shrink:0;transition:transform .25s}
tr:hover .emoji,.li:hover .emoji{transform:scale(1.15) rotate(-6deg)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted)}

/* toolbar */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.field{position:relative;flex:1;min-width:210px}
.field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
input,select{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
.field input{padding-left:42px}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.sel{width:auto;min-width:160px;flex:0 0 auto}
select{cursor:pointer}

/* table */
.table-card{padding:0;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:15px 16px;background:var(--surface-2);cursor:pointer;user-select:none;white-space:nowrap;transition:color .2s}
th:hover{color:var(--accent)}
th .ar{display:inline-block;margin-left:4px;transition:transform .25s;opacity:.0}
th.sorted{color:var(--accent)}
th.sorted .ar{opacity:1}
th.desc .ar{transform:rotate(180deg)}
th.nosort{cursor:default}
td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{animation:rowIn .45s both;transition:background .2s,opacity .3s,transform .3s}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tbody tr.removing{opacity:0;transform:translateX(40px)}
.pname{display:flex;align-items:center;gap:14px;font-weight:600}
.muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:700}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.badge.low{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.badge.low::before,.badge.out::before{animation:pulse 1.4s infinite}
.badge.out,.badge.cancelled{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.badge.pending{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.badge.completed{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
@keyframes pulse{50%{opacity:.25;transform:scale(1.5)}}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.stepper button{width:26px;height:26px;border:0;border-radius:8px;background:var(--surface);font-weight:700;transition:all .15s}
.stepper button:hover{background:var(--accent);color:#fff;transform:scale(1.1)}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.4);color:var(--accent)}}
.pager{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;flex-wrap:wrap;gap:8px}
.pager .pg{display:flex;gap:6px}
.pager button{min-width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;transition:all .15s}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:44px;animation:bounce 1.6s infinite}
@keyframes bounce{50%{transform:translateY(-8px)}}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,9,25,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;width:100%;max-width:480px;box-shadow:0 30px 70px rgba(0,0,0,.35);transform:translateY(30px) scale(.92);transition:transform .35s cubic-bezier(.2,1.2,.4,1)}
.overlay.open .modal{transform:none}
.modal h2{font-size:22px;margin-bottom:4px}
.modal .sub{margin-bottom:12px;font-size:14px}
.modal label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;transition:all .15s}
.emoji-pick button:hover{transform:scale(1.15)}
.emoji-pick button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:0}

/* toast */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{background:var(--text);color:var(--bg);padding:13px 18px;border-radius:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:toastIn .4s cubic-bezier(.2,1.2,.4,1);max-width:340px}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(60px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateX(60px)}}

/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border:0}
.set-row .t{font-weight:700}
.set-row .s{color:var(--muted);font-size:14px;margin-top:2px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted);transition:all .25s}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.swatches{display:flex;gap:10px}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;transition:transform .2s,border-color .2s}
.swatches button:hover{transform:scale(1.2)}
.swatches button.on{border-color:var(--text);transform:scale(1.15)}
.set-row input,.set-row select{width:170px}

@media(max-width:1000px){.two{grid-template-columns:1fr}}
@media(max-width:820px){
  .side{position:fixed;left:0;top:0;transform:translateX(-100%)}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .burger{display:grid;place-items:center}
  main{padding:18px 16px 50px}
  h1{font-size:26px}
  .bar-row{grid-template-columns:80px 1fr 70px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<aside class="side" id="side">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l2-5M18 9l-2-5M3 9h18l-2 11H5z"/></svg></div>
    <span id="brandName">Shop Desk</span>
  </div>
  <nav class="nav" id="nav">
    <a href="#/dashboard" data-r="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Dashboard</a>
    <a href="#/inventory" data-r="inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>Inventory<span class="count" id="cInv">0</span></a>
    <a href="#/orders" data-r="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.600h7.700a2 2 0 0 0 2-1.500L21 7H6"/></svg>Orders<span class="count" id="cOrd">0</span></a>
    <a href="#/reports" data-r="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    <a href="#/settings" data-r="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.1a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.1a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.1a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/></svg>Settings</a>
  </nav>
  <div class="side-foot"><b id="clock">--:--</b><span id="dateLine"></span></div>
</aside>

<main>
  <div class="topbar"><button class="burger" id="burger" aria-label="Menu">☰</button></div>
  <div id="view"></div>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ---------- data ---------- */
const SEED=[
 ["Cola Drink","DR-001","Drinks",25,18,"🥤"],["Fresh Milk","DA-014","Dairy",42,5,"🥛"],
 ["Loaf Bread","BK-006","Bakery",55,12,"🍞"],["Instant Noodles","GR-022","Grocery",15,3,"🍜"],
 ["Brown Eggs","DA-009","Dairy",95,24,"🥚"],["Sardines","CN-018","Canned Goods",28,7,"🐟"],
 ["Orange Juice","DR-004","Drinks",38,14,"🧃"],["Cheddar Cheese","DA-021","Dairy",120,9,"🧀"],
 ["Croissant","BK-011","Bakery",35,4,"🥐"],["White Rice 1kg","GR-001","Grocery",62,30,"🍚"],
 ["Corned Beef","CN-007","Canned Goods",58,0,"🥫"],["Mineral Water","DR-010","Drinks",18,48,"💧"],
 ["Butter","DA-030","Dairy",85,11,"🧈"],["Donut Box","BK-015","Bakery",110,6,"🍩"]
].map((a,i)=>({id:i+1,name:a[0],sku:a[1],cat:a[2],price:a[3],stock:a[4],emoji:a[5]}));
const CATS=["Drinks","Dairy","Bakery","Grocery","Canned Goods"];
const EMOJIS=["🥤","🥛","🍞","🍜","🥚","🐟","🧃","🧀","🥐","🍚","🥫","💧","🧈","🍩","🍎","🍌","🥩","🍫","🧴","📦"];
const DEF_SET={theme:"auto",accent:"#6366f1",threshold:5,currency:"₱",store:"Shop Desk"};

let products=store.get("sd_products",null)||SEED;
let orders=store.get("sd_orders",null)||(()=>{const d=Date.now();return[
 {id:1001,pid:1,name:"Cola Drink",emoji:"🥤",qty:6,total:150,date:d-36e5*3,status:"completed"},
 {id:1002,pid:5,name:"Brown Eggs",emoji:"🥚",qty:2,total:190,date:d-36e5*20,status:"completed"},
 {id:1003,pid:3,name:"Loaf Bread",emoji:"🍞",qty:3,total:165,date:d-36e5*30,status:"pending"}]})();
let S={...DEF_SET,...store.get("sd_settings",{})};
const save=()=>{store.set("sd_products",products);store.set("sd_orders",orders);store.set("sd_settings",S)};

const money=n=>S.currency+Number(n).toLocaleString("en-PH",{maximumFractionDigits:2});
const statusOf=p=>p.stock<=0?"out":p.stock<=S.threshold?"low":"ok";
const statusLabel={ok:"In Stock",low:"Low Stock",out:"Out of Stock"};
const nextId=a=>a.reduce((m,x)=>Math.max(m,x.id),0)+1;
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.round(m/60);return h<24?h+"h ago":Math.round(h/24)+"d ago"};

/* ---------- theme ---------- */
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(){
  const t=S.theme==="auto"?(mq.matches?"dark":"light"):S.theme;
  document.documentElement.dataset.theme=t;
  document.documentElement.style.setProperty("--accent",S.accent);
  $("#brandName").textContent=S.store||"Shop Desk";
}
mq.addEventListener("change",applyTheme);

/* ---------- helpers ---------- */
function toast(msg,icon="✓"){
  const t=document.createElement("div");t.className="toast";t.innerHTML=`<span>${icon}</span><span>${esc(msg)}</span>`;
  $("#toasts").appendChild(t);
  setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),300)},2600);
}
function countUp(el,to,fmt=v=>Math.round(v),dur=1000){
  const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(f)})(t0);
}
function animateCounts(root=document){$$("[data-count]",root).forEach(el=>{
  const to=+el.dataset.count,m=el.dataset.money==="1";
  countUp(el,to,m?v=>money(v):v=>Math.round(v))})}
function growBars(root=document){requestAnimationFrame(()=>setTimeout(()=>$$(".bar-fill",root).forEach(b=>b.style.width=b.dataset.w+"%"),60))}
function badge(cls,text){return`<span class="badge ${cls}">${text}</span>`}
function download(name,rows){
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function openModal(html){$("#modal").innerHTML=html;$("#overlay").classList.add("open");setTimeout(()=>{const f=$("#modal input,#modal select");f&&f.focus()},120)}
function closeModal(){$("#overlay").classList.remove("open")}
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function confirmBox(title,text,okLabel,onOk){
  openModal(`<h2>${esc(title)}</h2><p class="sub">${esc(text)}</p><div class="acts"><button class="btn" id="cNo">Cancel</button><button class="btn primary" id="cYes" style="background:var(--bad)">${esc(okLabel)}</button></div>`);
  $("#cNo").onclick=closeModal;$("#cYes").onclick=()=>{closeModal();onOk()};
}

function statCards(items){return`<div class="grid stats">${items.map((s,i)=>`<div class="card stat" style="--c:${s.c};animation-delay:${i*90}ms"><div class="ic">${s.i}</div><div><div class="l">${s.l}</div><div class="v" data-count="${s.v}" ${s.m?'data-money="1"':""}>0</div></div></div>`).join("")}</div>`}
function totals(){
  const low=products.filter(p=>statusOf(p)!=="ok").length;
  return{total:products.length,low,value:products.reduce((a,p)=>a+p.price*p.stock,0),units:products.reduce((a,p)=>a+p.stock,0)};
}
function sidebarCounts(){$("#cInv").textContent=products.length;$("#cOrd").textContent=orders.filter(o=>o.status==="pending").length}

/* ---------- router ---------- */
const routes={dashboard:vDashboard,inventory:vInventory,orders:vOrders,reports:vReports,settings:vSettings};
function route(){
  const r=(location.hash.replace("#/","")||"dashboard");const name=routes[r]?r:"dashboard";
  $$("#nav a").forEach(a=>a.classList.toggle("active",a.dataset.r===name));
  $("#side").classList.remove("open");
  const v=$("#view");v.className="view";v.innerHTML="";void v.offsetWidth;v.className="view";
  routes[name](v);sidebarCounts();window.scrollTo({top:0});
}
addEventListener("hashchange",route);
$("#burger").onclick=()=>$("#side").classList.toggle("open");

/* ---------- dashboard ---------- */

  </div>
  <div class="card" style="margin-top:18px"><h3>Recent orders <a href="#/orders">All orders →</a></h3>

/* ---------- inventory ---------- */
const IV={q:"",cat:"",st:"",sort:"name",dir:1,page:1,per:8};
function vInventory(v){
  const t=totals();
  v.innerHTML=`
  <div class="page-head"><div><h1>Inventory</h1><p class="sub">Manage products and current stock.</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="exp">${IC.dl}Export CSV</button><button class="btn primary" id="add">${IC.plus}Add Product</button></div></div>
  ${statCards([{l:"Total Products",v:t.total,c:"#6366f1",i:IC.box},{l:"Low Stock",v:t.low,c:"#f59e0b",i:IC.warn},{l:"Stock Value",v:t.value,m:1,c:"#10b981",i:IC.coin}])}
  <div class="toolbar">
    <div class="field">${IC.search}<input id="q" placeholder="Search name or SKU…" value="${esc(IV.q)}"></div>
    <select class="sel" id="fc"><option value="">All Categories</option>${CATS.map(c=>`<option ${IV.cat===c?"selected":""}>${c}</option>`).join("")}</select>
    <select class="sel" id="fs"><option value="">All Status</option><option value="ok" ${IV.st==="ok"?"selected":""}>In Stock</option><option value="low" ${IV.st==="low"?"selected":""}>Low Stock</option><option value="out" ${IV.st==="out"?"selected":""}>Out of Stock</option></select>
  </div>
  <div class="card table-card"><div class="scroll"><table>
    <thead><tr>${[["name","Product"],["sku","SKU"],["cat","Category"],["price","Price"],["stock","Stock"],["status","Status"]].map(([k,l])=>`<th data-k="${k}">${l}<span class="ar">▲</span></th>`).join("")}<th class="nosort" style="text-align:right">Actions</th></tr></thead>
    <tbody id="tb"></tbody></table></div><div id="pager"></div></div>`;
  animateCounts(v);
  $("#q").oninput=e=>{IV.q=e.target.value;IV.page=1;drawRows()};
  $("#fc").onchange=e=>{IV.cat=e.target.value;IV.page=1;drawRows()};
  $("#fs").onchange=e=>{IV.st=e.target.value;IV.page=1;drawRows()};
  $$("th[data-k]",v).forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(IV.sort===k)IV.dir*=-1;else{IV.sort=k;IV.dir=1}drawRows()});
  $("#add").onclick=()=>productForm();
  $("#exp").onclick=()=>{download("inventory.csv",[["Name","SKU","Category","Price","Stock","Status"],...products.map(p=>[p.name,p.sku,p.cat,p.price,p.stock,statusLabel[statusOf(p)]])]);toast("Inventory exported","⬇️")};
  drawRows();
}
function drawRows(animate=true){
  const q=IV.q.toLowerCase();
  let list=products.filter(p=>(!IV.cat||p.cat===IV.cat)&&(!IV.st||statusOf(p)===IV.st)&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)));
  const key=IV.sort;
  list.sort((a,b)=>{const x=key==="status"?statusOf(a):a[key],y=key==="status"?statusOf(b):b[key];return(typeof x==="number"?x-y:String(x).localeCompare(String(y)))*IV.dir});
  $$("th[data-k]").forEach(th=>{th.classList.toggle("sorted",th.dataset.k===IV.sort);th.classList.toggle("desc",th.dataset.k===IV.sort&&IV.dir<0)});
  const pages=Math.max(1,Math.ceil(list.length/IV.per));IV.page=Math.min(IV.page,pages);
  const slice=list.slice((IV.page-1)*IV.per,IV.page*IV.per);
  const tb=$("#tb");if(!tb)return;
  tb.innerHTML=slice.length?slice.map((p,i)=>{const s=statusOf(p);return`<tr data-id="${p.id}" style="animation-delay:${animate?i*45:0}ms">
    <td><div class="pname"><div class="emoji">${p.emoji}</div>${esc(p.name)}</div></td>
    <td class="muted">${esc(p.sku)}</td><td>${esc(p.cat)}</td><td><b>${money(p.price)}</b></td>
    <td><div class="stepper"><button data-d="-1" aria-label="Decrease">−</button><span>${p.stock}</span><button data-d="1" aria-label="Increase">+</button></div></td>
    <td>${badge(s,statusLabel[s])}</td>
    <td style="text-align:right;white-space:nowrap"><button class="icon-btn" data-e title="Edit">${IC.edit}</button><button class="icon-btn del" data-x title="Delete">${IC.trash}</button></td></tr>`}).join(""):
    `<tr><td colspan="7"><div class="empty"><div class="big">🔍</div>No products match your filters.</div></td></tr>`;
  $("#pager").innerHTML=`<div class="pager"><span>Showing ${list.length?(IV.page-1)*IV.per+1:0}–${Math.min(IV.page*IV.per,list.length)} of ${list.length}</span><div class="pg"><button id="pp" ${IV.page<=1?"disabled":""}>‹</button>${Array.from({length:pages},(_,i)=>`<button class="${i+1===IV.page?"on":""}" data-p="${i+1}">${i+1}</button>`).join("")}<button id="pn" ${IV.page>=pages?"disabled":""}>›</button></div></div>`;
  $$("[data-p]").forEach(b=>b.onclick=()=>{IV.page=+b.dataset.p;drawRows()});
  $("#pp").onclick=()=>{IV.page--;drawRows()};$("#pn").onclick=()=>{IV.page++;drawRows()};
  $$("tr[data-id]",tb).forEach(tr=>{
    const p=products.find(x=>x.id==tr.dataset.id);
    $$("[data-d]",tr).forEach(b=>b.onclick=()=>{p.stock=Math.max(0,p.stock+ +b.dataset.d);save();
      const ns=statusOf(p);$("span",tr).textContent=p.stock;$("span",tr).classList.remove("bump");void $("span",tr).offsetWidth;$("span",tr).classList.add("bump");
      tr.children[5].innerHTML=badge(ns,statusLabel[ns]);sidebarCounts()});
    $("[data-e]",tr).onclick=()=>productForm(p);
    $("[data-x]",tr).onclick=()=>confirmBox("Delete product?",`"${p.name}" will be removed from your inventory.`,"Delete",()=>{
      tr.classList.add("removing");setTimeout(()=>{products=products.filter(x=>x.id!==p.id);save();toast(`Deleted ${p.name}`,"🗑️");route()},300)});
  });
}
function productForm(p){
  const e=!!p;let emoji=p?p.emoji:"📦";
  openModal(`<h2>${e?"Edit":"Add"} product</h2><p class="sub">${e?"Update the details below.":"Fill in the details for your new item."}</p>
  <form id="pf"><label>Name</label><input id="fn" required maxlength="40" value="${e?esc(p.name):""}">
  <div class="row2"><div><label>SKU</label><input id="fk" required maxlength="14" value="${e?esc(p.sku):""}"></div>
  <div><label>Category</label><select id="fcat">${CATS.map(c=>`<option ${e&&p.cat===c?"selected":""}>${c}</option>`).join("")}</select></div></div>
  <div class="row2"><div><label>Price (${S.currency})</label><input id="fp" type="number" min="0" step="0.01" required value="${e?p.price:""}"></div>
  <div><label>Stock</label><input id="fst" type="number" min="0" step="1" required value="${e?p.stock:""}"></div></div>
  <label>Icon</label><div class="emoji-pick" id="ep">${EMOJIS.map(x=>`<button type="button" class="${x===emoji?"on":""}">${x}</button>`).join("")}</div>
  <div class="err" id="err"></div>
  <div class="acts"><button type="button" class="btn" id="cx">Cancel</button><button class="btn primary">${e?"Save changes":"Add product"}</button></div></form>`);
  $$("#ep button").forEach(b=>b.onclick=()=>{emoji=b.textContent;$$("#ep button").forEach(x=>x.classList.toggle("on",x===b))});
  $("#cx").onclick=closeModal;
  $("#pf").onsubmit=ev=>{ev.preventDefault();
    const sku=$("#fk").value.trim().toUpperCase();
    if(products.some(x=>x.sku===sku&&(!e||x.id!==p.id))){$("#err").textContent="That SKU already exists.";return}
    const d={name:$("#fn").value.trim(),sku,cat:$("#fcat").value,price:parseFloat($("#fp").value),stock:parseInt($("#fst").value,10),emoji};
    if(e){Object.assign(p,d);toast("Product updated")}else{products.push({id:nextId(products),...d});toast("Product added","🎉")}
    save();closeModal();route();
  };
}

/* ---------- orders ---------- */
const OV={f:"all"};
function vOrders(v){
  const sum=k=>orders.filter(o=>o.status===k).length;
  const rev=orders.filter(o=>o.status==="completed").reduce((a,o)=>a+o.total,0);
  v.innerHTML=`<div class="page-head"><div><h1>Orders</h1><p class="sub">Create orders and track their status. Stock updates automatically.</p></div>
    <button class="btn primary" id="no">${IC.plus}New Order</button></div>
  ${statCards([{l:"Pending",v:sum("pending"),c:"#f59e0b",i:IC.cart},{l:"Completed",v:sum("completed"),c:"#10b981",i:IC.check},{l:"Revenue",v:rev,m:1,c:"#6366f1",i:IC.coin}])}
  <div class="toolbar"><div class="seg" id="seg">${["all","pending","completed","cancelled"].map(f=>`<button data-f="${f}" class="${OV.f===f?"on":""}">${f[0].toUpperCase()+f.slice(1)}</button>`).join("")}</div></div>
  <div class="card table-card"><div class="scroll"><table><thead><tr><th class="nosort">Order</th><th class="nosort">Product</th><th class="nosort">Qty</th><th class="nosort">Total</th><th class="nosort">When</th><th class="nosort">Status</th><th class="nosort" style="text-align:right">Actions</th></tr></thead><tbody id="ob"></tbody></table></div></div>`;
  animateCounts(v);
  $("#no").onclick=orderForm;
  $$("#seg button").forEach(b=>b.onclick=()=>{OV.f=b.dataset.f;$$("#seg button").forEach(x=>x.classList.toggle("on",x===b));drawOrders()});
  drawOrders();
}
function drawOrders(){
  const list=[...orders].filter(o=>OV.f==="all"||o.status===OV.f).sort((a,b)=>b.date-a.date);
  $("#ob").innerHTML=list.length?list.map((o,i)=>`<tr style="animation-delay:${i*45}ms" data-id="${o.id}"><td><b>#${o.id}</b></td><td><div class="pname"><div class="emoji">${o.emoji}</div>${esc(o.name)}</div></td><td>${o.qty}</td><td><b>${money(o.total)}</b></td><td class="muted">${ago(o.date)}</td><td>${badge(o.status,o.status[0].toUpperCase()+o.status.slice(1))}</td>
    <td style="text-align:right;white-space:nowrap">${o.status==="pending"?`<button class="icon-btn" data-ok title="Mark completed">${IC.check}</button><button class="icon-btn del" data-no title="Cancel order">${IC.x}</button>`:`<button class="icon-btn del" data-rm title="Remove">${IC.trash}</button>`}</td></tr>`).join(""):
    `<tr><td colspan="7"><div class="empty"><div class="big">🛒</div>No ${OV.f==="all"?"":OV.f+" "}orders yet.</div></td></tr>`;
  $$("#ob tr[data-id]").forEach(tr=>{const o=orders.find(x=>x.id==tr.dataset.id);
    const ok=$("[data-ok]",tr),no=$("[data-no]",tr),rm=$("[data-rm]",tr);
    if(ok)ok.onclick=()=>{o.status="completed";save();toast(`Order #${o.id} completed`,"✅");route()};
    if(no)no.onclick=()=>{o.status="cancelled";const p=products.find(x=>x.id===o.pid);if(p)p.stock+=o.qty;save();toast(`Order #${o.id} cancelled, stock restored`,"↩️");route()};
    if(rm)rm.onclick=()=>{orders=orders.filter(x=>x.id!==o.id);save();toast("Order removed","🗑️");route()};
  });
}
function orderForm(){
  const avail=products.filter(p=>p.stock>0);
  if(!avail.length){toast("No products in stock to order","⚠️");return}
  openModal(`<h2>New order</h2><p class="sub">Stock is deducted as soon as the order is created.</p>
  <form id="of"><label>Product</label><select id="op">${avail.map(p=>`<option value="${p.id}">${p.emoji} ${esc(p.name)} (${p.stock} left)</option>`).join("")}</select>
  <label>Quantity</label><input id="oq" type="number" min="1" value="1" required>
  <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center"><span class="muted">Total</span><b style="font-size:24px" id="ot"></b></div>
  <div class="err" id="err"></div>
  <div class="acts"><button type="button" class="btn" id="cx">Cancel</button><button class="btn primary">Place order</button></div></form>`);
  const calc=()=>{const p=products.find(x=>x.id==$("#op").value);$("#oq").max=p.stock;$("#ot").textContent=money(p.price*(+$("#oq").value||0))};
  $("#op").onchange=calc;$("#oq").oninput=calc;calc();$("#cx").onclick=closeModal;
  $("#of").onsubmit=e=>{e.preventDefault();const p=products.find(x=>x.id==$("#op").value),q=parseInt($("#oq").value,10);
    if(q>p.stock){$("#err").textContent=`Only ${p.stock} in stock.`;return}
    p.stock-=q;orders.push({id:Math.max(1000,...orders.map(o=>o.id))+1,pid:p.id,name:p.name,emoji:p.emoji,qty:q,total:p.price*q,date:Date.now(),status:"pending"});
    save();closeModal();toast("Order placed","🛍️");route()};
}

/* ---------- reports ---------- */
function vReports(v){
  const valByCat=CATS.map(c=>({c,n:products.filter(p=>p.cat===c).reduce((a,p)=>a+p.price*p.stock,0)}));
  const maxV=Math.max(1,...valByCat.map(x=>x.n));
  const sold={};orders.filter(o=>o.status!=="cancelled").forEach(o=>{sold[o.name]=sold[o.name]||{q:0,t:0,e:o.emoji};sold[o.name].q+=o.qty;sold[o.name].t+=o.total});
  const top=Object.entries(sold).sort((a,b)=>b[1].q-a[1].q).slice(0,5);
  const done=orders.filter(o=>o.status==="completed"),rev=done.reduce((a,o)=>a+o.total,0);
  const t=totals();
  v.innerHTML=`<div class="page-head"><div><h1>Reports</h1><p class="sub">A snapshot of stock health and sales.</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="e1">${IC.dl}Inventory CSV</button><button class="btn" id="e2">${IC.dl}Orders CSV</button></div></div>
  ${statCards([{l:"Revenue",v:rev,m:1,c:"#10b981",i:IC.coin},{l:"Avg. order",v:done.length?rev/done.length:0,m:1,c:"#6366f1",i:IC.cart},{l:"Units in stock",v:t.units,c:"#ec4899",i:IC.box},{l:"Stock value",v:t.value,m:1,c:"#f59e0b",i:IC.coin}])}
  <div class="grid two"><div class="card"><h3>Stock value by category</h3>${valByCat.map(x=>`<div class="bar-row"><span>${x.c}</span><div class="bar-track"><div class="bar-fill" data-w="${x.n/maxV*100}"></div></div><span class="n">${money(x.n)}</span></div>`).join("")}</div>
  <div class="card"><h3>Top selling</h3>${top.length?top.map(([n,d],i)=>`<div class="li" style="animation-delay:${i*70}ms"><div class="emoji">${d.e}</div><div class="grow"><div class="t">${esc(n)}</div><div class="s">${d.q} units sold</div></div><b>${money(d.t)}</b></div>`).join(""):`<div class="empty">Create some orders to see data here.</div>`}</div></div>`;
  animateCounts(v);growBars(v);
  $("#e1").onclick=()=>{download("inventory.csv",[["Name","SKU","Category","Price","Stock"],...products.map(p=>[p.name,p.sku,p.cat,p.price,p.stock])]);toast("Inventory exported","⬇️")};
  $("#e2").onclick=()=>{download("orders.csv",[["Order","Product","Qty","Total","Status","Date"],...orders.map(o=>[o.id,o.name,o.qty,o.total,o.status,new Date(o.date).toISOString()])]);toast("Orders exported","⬇️")};
}

/* ---------- settings ---------- */
function vSettings(v){
  const accents=["#6366f1","#8b5cf6","#ec4899","#ef4444","#f59e0b","#10b981","#0ea5e9"];
  v.innerHTML=`<div class="page-head"><div><h1>Settings</h1><p class="sub">Personalise your shop. Changes save automatically.</p></div></div>
  <div class="card">
    <div class="set-row"><div><div class="t">Shop name</div><div class="s">Shown in the sidebar.</div></div><input id="sn" maxlength="20" value="${esc(S.store)}"></div>
    <div class="set-row"><div><div class="t">Theme</div><div class="s">Light, dark, or follow your device.</div></div><div class="seg" id="th">${["light","dark","auto"].map(x=>`<button data-t="${x}" class="${S.theme===x?"on":""}">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div></div>
    <div class="set-row"><div><div class="t">Accent colour</div><div class="s">Buttons, highlights and charts.</div></div><div class="swatches" id="sw">${accents.map(c=>`<button style="background:${c}" data-c="${c}" class="${S.accent===c?"on":""}" aria-label="${c}"></button>`).join("")}</div></div>
    <div class="set-row"><div><div class="t">Low stock threshold</div><div class="s">Items at or below this count are flagged.</div></div><input id="lt" type="number" min="1" max="100" value="${S.threshold}"></div>
    <div class="set-row"><div><div class="t">Currency symbol</div><div class="s">Used for all prices.</div></div><select id="cu">${["₱","$","€","£","¥","₹"].map(c=>`<option ${S.currency===c?"selected":""}>${c}</option>`).join("")}</select></div>
    <div class="set-row"><div><div class="t">Demo data</div><div class="s">Restore the sample products and orders.</div></div><button class="btn danger" id="rs">Reset data</button></div>
  </div>`;
  $("#sn").oninput=e=>{S.store=e.target.value.trim()||"Shop Desk";save();applyTheme()};
  $$("#th button").forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;save();applyTheme();$$("#th button").forEach(x=>x.classList.toggle("on",x===b))});
  $$("#sw button").forEach(b=>b.onclick=()=>{S.accent=b.dataset.c;save();applyTheme();$$("#sw button").forEach(x=>x.classList.toggle("on",x===b))});
  $("#lt").onchange=e=>{S.threshold=Math.max(1,parseInt(e.target.value,10)||5);save();toast("Threshold updated");sidebarCounts()};
  $("#cu").onchange=e=>{S.currency=e.target.value;save();toast("Currency updated")};
  $("#rs").onclick=()=>confirmBox("Reset all data?","This restores the demo products and orders and removes your changes.","Reset",()=>{
    products=JSON.parse(JSON.stringify(SEED));orders=[];save();localStorage.removeItem("sd_orders");toast("Data reset","♻️");route()});
}

/* ---------- clock ---------- */
function tick(){const d=new Date();$("#clock").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});$("#dateLine").textContent=d.toLocaleDateString([], {weekday:"long",month:"short",day:"numeric"})}
setInterval(tick,15000);tick();

applyTheme();
if(!location.hash)location.hash="#/dashboard";
route();
</script>
</body>
</html>
